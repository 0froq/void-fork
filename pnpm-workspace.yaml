packages:
  - docs
  - packages/*
  - playground/*
  - playground-local/*

catalogMode: strict

allowBuilds:
  '@parcel/watcher': false
  '@prisma/engines': false
  better-sqlite3: true
  esbuild: true
  lmdb: false
  msgpackr-extract: false
  prisma: false
  sharp: false
  vue-demi: false
  workerd: true

catalog:
  '@clack/prompts': ^1.7.0
  '@cloudflare/workers-types': ^4.20260702.1
  '@types/node': ^26.1.0
  typescript: 7.0.2
  '@voidzero-dev/vitepress-theme': ^5.0.7
  pathslash: ^0.1.0
  vite: npm:@voidzero-dev/vite-plus-core@0.3.1
  vite-plus: 0.3.1
  wrangler: ^4.107.0

catalogs:
  angular:
    typescript: 6.0.3

overrides:
  esbuild: ^0.27.3
  vite@*: 'catalog:'

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    tailwindcss: '*'
    vite: '*'
