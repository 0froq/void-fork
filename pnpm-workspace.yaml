packages:
  - packages/*

allowBuilds:
  better-sqlite3: true
  esbuild: true
  sharp: true
  workerd: true

catalog:
  '@cloudflare/workers-types': ^5.0.0
  typescript: 7.0.2
  # Keep in lockstep with the framework submodule's hono (framework/packages/void: ^4.13.7).
  # A newer catalog hono breaks the dashboard vue-tsc Context<…> typecheck (regressed in #200,
  # re-regressed in #218). Renovate is disabled for hono in .github/renovate.json so it stays
  # manually pinned to the submodule; only bump this when the framework submodule bumps hono.
  hono: 4.13.7
  wrangler: ^4.90.0
  vite: npm:@voidzero-dev/vite-plus-core@0.3.1
  vite-plus: ^0.3.1
  vitest: 4.1.11

onlyBuiltDependencies:
  - better-sqlite3
  - esbuild
  - workerd

overrides:
  vite: 'catalog:'
  hono: 'catalog:'
  void: link:framework/packages/void
  '@void/react': link:framework/packages/react
  '@void/vue': link:framework/packages/vue
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: '*'

# First-party packages are published by VoidZero itself, so the supply-chain
# minimumReleaseAge check (meant to quarantine freshly-published *third-party*
# releases) only adds friction here — it breaks `vp install` for ~24h after
# every first-party bump (e.g. the vite-plus 0.2.0 bump in #183). Exclude the
# org's own toolchain scopes; third-party packages stay gated. Matches the list
# Vite+ (`vp config`) maintains automatically.
minimumReleaseAgeExclude:
  - vite-plus
  - '@voidzero-dev/*'
  - oxlint
  - '@oxlint/*'
  - oxlint-tsgolint
  - '@oxlint-tsgolint/*'
  - oxfmt
  - '@oxfmt/*'
