packages:
  - packages/*

allowBuilds:
  better-sqlite3: true
  esbuild: true
  sharp: true
  workerd: true

catalog:
  '@cloudflare/workers-types': ^4.20260508.1
  '@typescript/native-preview': 7.0.0-dev.20260624.1
  # Keep in lockstep with the framework submodule's hono (framework/packages/void: ^4.12.18).
  # A newer catalog hono breaks the dashboard vue-tsc Context<…> typecheck (regressed in #200).
  hono: 4.12.18
  wrangler: ^4.90.0
  vite: npm:@voidzero-dev/vite-plus-core@0.2.1
  vitest: 4.1.9
  vite-plus: ^0.2.0

onlyBuiltDependencies:
  - better-sqlite3
  - esbuild
  - workerd

overrides:
  vite: 'catalog:'
  vitest: 'catalog:'
  hono: 'catalog:'
  void: link:framework/packages/void
  '@void/react': link:framework/packages/react
  '@void/vue': link:framework/packages/vue
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'

# First-party packages are published by VoidZero itself, so the supply-chain
# minimumReleaseAge check (meant to quarantine freshly-published *third-party*
# releases) only adds friction here — it breaks `vp install` for ~24h after
# every first-party bump (e.g. the vite-plus 0.2.0 bump in #183). Exclude the
# org's own toolchain scopes; third-party packages stay gated. Matches the list
# Vite+ (`vp config`) maintains automatically.
minimumReleaseAgeExclude:
  - vite-plus
  - '@voidzero-dev/*'
  - oxlint
  - '@oxlint/*'
  - oxlint-tsgolint
  - '@oxlint-tsgolint/*'
  - oxfmt
  - '@oxfmt/*'
