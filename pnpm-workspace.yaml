packages:
  - docs
  - packages/*
  - platform
  - platform/packages/*
  - playground/*
  # Dependencies for the Kit 2 compatibility test; app source comes from the Kit 3 playground.
  - test/fixtures/sveltekit-v2

catalogMode: strict

allowBuilds:
  '@astryxdesign/core': false
  '@parcel/watcher': false
  '@prisma/engines': false
  better-sqlite3: false
  esbuild: true
  lmdb: false
  msgpackr-extract: false
  prisma: false
  sharp: false
  vue-demi: false
  workerd: true

catalog:
  # Stays on 4.x on purpose: Wrangler lists workers-types ^5 as an OPTIONAL peer, and
  # every 5.x since 5.20260807.2 declares global `Buffer`/`process` as `any`, which collides
  # with `@types/node` under packages/void's `types: ["node", "@cloudflare/workers-types"]`
  # (Buffer loses its members; ~30 typecheck errors). Revisit when upstream drops those globals.
  '@cloudflare/workers-types': ^4.20260702.1
  '@types/node': ^26.6.4
  '@voidzero-dev/vite-plus-prompts': 1.1.0
  typescript: 7.0.2
  '@voidzero-dev/vitepress-theme': ^5.0.7
  pathslash: ^0.1.0
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0
  vite-plus: 1.0.0
  vitest: 5.0.3
  wrangler: 4.148.0
  cf: 1.0.0-beta.13
  oauth4webapi: ^3.8.8
  '@astryxdesign/core': 0.6.5
  '@astryxdesign/theme-neutral': 0.6.5
  '@stylexjs/stylex': 0.19.1

catalogs:
  angular:
    typescript: 6.0.3
  platform:
    '@cloudflare/workers-types': ^5.20260929.1
    hono: 4.13.13
    wrangler: ^4.148.0
  sveltekit:
    typescript: 6.0.3

packageExtensions:
  '@analogjs/vite-plugin-angular@2.8.0':
    peerDependencies:
      typescript: '>=6.0 <6.1'

overrides:
  # Keep Vite+'s pinned Vitest internals on the same patch as the runner.
  '@vitest/browser': 5.0.3
  '@vitest/browser-preview': 5.0.3
  '@vitest/mocker': 5.0.3
  '@vitest/pretty-format': 5.0.3
  '@vitest/snapshot': 5.0.3
  '@vitest/spy': 5.0.3
  '@vitest/utils': 5.0.3
  esbuild: ^0.28.2
  react-server-dom-webpack: 19.3.0
  vite@*: 'catalog:'
  vitest@*: 'catalog:'

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    tailwindcss: '*'
    vite: '*'

minimumReleaseAgeExclude:
  - '@nkzw/*'
  - '@void/*'
  - cf
  - react-fate
  - void
  - void-fate
  # Keep the cf and Workers SDK release batch aligned, with exact age exceptions.
  - '@cloudflare/build-output-utils@0.8.6'
  - '@cloudflare/codemods@0.4.1'
  - '@cloudflare/config@0.24.0'
  - '@cloudflare/runtime-types@0.1.8'
  - '@cloudflare/vite-plugin@1.63.0'
  - '@cloudflare/workerd-darwin-64@1.20261006.1'
  - '@cloudflare/workerd-darwin-arm64@1.20261006.1'
  - '@cloudflare/workerd-linux-64@1.20261006.1'
  - '@cloudflare/workerd-linux-arm64@1.20261006.1'
  - '@cloudflare/workerd-windows-64@1.20261006.1'
  - 'miniflare@5.20261006.0-alpha'
  - 'workerd@1.20261006.1'
  - 'wrangler@4.148.0'
  - hono@4.13.13
  - lucide-react@1.52.0
  - '@voidzero-dev/vite-plus-prompts@1.1.0'

patchedDependencies:
  # Remove when upgrading to the next prompts release containing the one-space output fix.
  '@voidzero-dev/vite-plus-prompts@1.1.0': patches/@voidzero-dev__vite-plus-prompts@1.1.0.patch
