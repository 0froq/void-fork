name: Deploy Staging

on:
  push:
    branches: [main]

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    environment: Staging
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # build the CLI & vue plugin first and link it as the deploy relies on them
      - run: pnpm -F vue -F vite-cloud build && pnpm i

      # deploy platform and dispatch workers
      - run: pnpm run deploy:staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

      # deploy docs
      # note: staging docs are also hosted on prod
      - run: pnpm deploy:staging:docs
        env:
          VITE_CLOUD_TOKEN: ${{ secrets.VITE_CLOUD_TOKEN }}
