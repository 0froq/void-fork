name: Deploy Staging

on:
  push:
    branches: [main]

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    secrets:
      FRAMEWORK_REPO_TOKEN: ${{ secrets.FRAMEWORK_REPO_TOKEN }}

  deploy:
    needs: ci
    runs-on: blacksmith-4vcpu-ubuntu-2404
    environment: Staging
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.FRAMEWORK_REPO_TOKEN }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      # framework build only needed when deploying dashboard

      # - uses: actions/cache@v4
      #   with:
      #     path: framework/node_modules
      #     key: framework-${{ hashFiles('framework/pnpm-lock.yaml') }}
      # - run: pnpm --dir framework install --frozen-lockfile
      # - run: pnpm --dir framework build
      - run: pnpm install --frozen-lockfile

      - run: pnpm run deploy:staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
