name: Publish

on:
  push:
    tags:
      - 'v*'

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    with:
      skip_windows: true

  publish:
    needs: ci
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: pnpm/action-setup@26f6d4f2c533a43e6b5da0b4a5dd983f98f7b49a # v6.0.4
      - run: echo "NODE_AUTH_TOKEN=${{ secrets.NPM_TOKEN }}" >> "$GITHUB_ENV"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # Configure the publish registry after install so docs dependencies under
      # @voidzero-dev continue to resolve from npm during installation.
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org

      - run: pnpm --filter ./packages/void publish --provenance --access public --no-git-checks
      - run: pnpm --filter ./packages/md publish --provenance --access public --no-git-checks
      - run: pnpm --filter ./packages/react publish --provenance --access public --no-git-checks
      - run: pnpm --filter ./packages/vue publish --provenance --access public --no-git-checks
      - run: pnpm --filter ./packages/svelte publish --provenance --access public --no-git-checks
      - run: pnpm --filter ./packages/solid publish --provenance --access public --no-git-checks
