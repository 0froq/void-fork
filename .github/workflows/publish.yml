name: Publish

on:
  push:
    tags:
      - 'v*'

permissions: {}

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  platform-ci:
    uses: ./.github/workflows/platform-ci.yml
    with:
      require-schema-compat: true
    permissions:
      contents: read
      deployments: read

  prepublish-test:
    name: Prepublish Test
    uses: ./.github/workflows/prepublish-test.yml
    with:
      suite: full
      include_macos: true
    permissions:
      contents: read
      pull-requests: read

  publish:
    needs: [ci, platform-ci, prepublish-test]
    runs-on: ubuntu-latest
    environment: Release
    permissions:
      contents: read
      id-token: write
    env:
      VOID_PLATFORM_SOURCE_REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@2dec1e33f4ab2c6d5bce1b0c4607961bb1a3f7a1 # v1.12.0
        with:
          node-version-file: .node-version
          cache: true
          registry-url: https://registry.npmjs.org
      - name: Validate release versions and channel
        id: release
        run: node .github/scripts/release-policy.ts
      - run: vp run build

      - run: npm install -g npm@11
      - name: Publish public packages
        env:
          RELEASE_NPM_TAG: ${{ steps.release.outputs.npm-tag }}
        run: vp pm publish -r --access public --tag "$RELEASE_NPM_TAG" --no-git-checks
