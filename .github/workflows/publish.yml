name: Publish

on:
  push:
    tags:
      - 'v*'

permissions: {}

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
    with:
      skip_windows: true

  publish:
    needs: ci
    runs-on: ubuntu-latest
    environment: Release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@56918a6d0c629c55ae8b88826a7d47fda85769ee # v1.9.0
        with:
          node-version-file: .node-version
          cache: true
          registry-url: https://registry.npmjs.org
      - run: vp run build

      - run: npm install -g npm@latest
      - name: Publish create-void
        working-directory: packages/create-void
        run: npm publish --access public --tag latest --provenance
      - name: Publish @void/md
        working-directory: packages/md
        run: npm publish --access public --tag latest --provenance
      - name: Publish void
        working-directory: packages/void
        run: npm publish --access public --tag latest --provenance
      - name: Publish @void/react
        working-directory: packages/react
        run: npm publish --access public --tag latest --provenance
      - name: Publish @void/vue
        working-directory: packages/vue
        run: npm publish --access public --tag latest --provenance
      - name: Publish @void/svelte
        working-directory: packages/svelte
        run: npm publish --access public --tag latest --provenance
      - name: Publish @void/solid
        working-directory: packages/solid
        run: npm publish --access public --tag latest --provenance
