name: Publish

on:
  push:
    tags:
      - 'v*'

permissions: {}

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
    with:
      skip_windows: true

  publish:
    needs: ci
    runs-on: ubuntu-latest
    environment: Release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@26f6d4f2c533a43e6b5da0b4a5dd983f98f7b49a # v6.0.4
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0 # zizmor: ignore[cache-poisoning]
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # Configure the publish registry after install so docs dependencies under
      # @voidzero-dev continue to resolve from npm during installation.
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0 # zizmor: ignore[cache-poisoning]
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org

      - run: mkdir -p .publish
      - run: pnpm --filter ./packages/void pack --pack-destination .publish
      - run: pnpm --filter ./packages/create-void pack --pack-destination .publish
      - run: pnpm --filter ./packages/md pack --pack-destination .publish
      - run: pnpm --filter ./packages/react pack --pack-destination .publish
      - run: pnpm --filter ./packages/vue pack --pack-destination .publish
      - run: pnpm --filter ./packages/svelte pack --pack-destination .publish
      - run: pnpm --filter ./packages/solid pack --pack-destination .publish

      - run: npm publish .publish/void-[0-9]*.tgz --access public
      - run: npm publish .publish/create-void-*.tgz --access public
      - run: npm publish .publish/void-md-*.tgz --access public
      - run: npm publish .publish/void-react-*.tgz --access public
      - run: npm publish .publish/void-vue-*.tgz --access public
      - run: npm publish .publish/void-svelte-*.tgz --access public
      - run: npm publish .publish/void-solid-*.tgz --access public
