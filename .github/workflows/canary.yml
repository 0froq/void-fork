name: Framework Canary

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  canary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      # Update framework deps to latest
      - run: pnpm -F dashboard up void @voidcloud/vue
      - run: pnpm install
      - run: pnpm -r build
      - run: pnpm check
      - run: pnpm test
