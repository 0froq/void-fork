name: Packed consumers

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      include_macos:
        description: Also verify packed packages on macOS.
        type: boolean
        required: false
        default: false

permissions: {}

jobs:
  packed-consumer:
    name: packed consumer (${{ matrix.os }}, ${{ matrix.pm }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      VOID_PLATFORM_SOURCE_REVISION: ${{ github.sha }}
    strategy:
      fail-fast: false
      matrix:
        os: '${{ inputs.include_macos && fromJSON(''["ubuntu-latest","macos-latest"]'') || fromJSON(''["ubuntu-latest"]'') }}'
        pm: [npm, pnpm]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@2dec1e33f4ab2c6d5bce1b0c4607961bb1a3f7a1 # v1.12.0
        with:
          node-version-file: .node-version
          cache: true
      - run: vp exec playwright install --with-deps chromium
        if: ${{ runner.os == 'Linux' }}
      - run: vp exec playwright install chromium
        if: ${{ runner.os != 'Linux' }}
      - run: vp run build
      - name: Verify packed packages with ${{ matrix.pm }}
        env:
          VOID_PACKED_PM: ${{ matrix.pm }}
        run: node .github/scripts/packed-consumer.mjs
