name: Smoke Test

on:
  schedule:
    - cron: '0 0 * * *' # daily at 8am SGT (midnight UTC)
  workflow_dispatch:
  workflow_call:
    secrets:
      FRAMEWORK_REPO_TOKEN:
        required: true
      VOID_TOKEN_STAGING:
        required: true
      CF_ACCESS_CLIENT_ID_STAGING:
        required: true
      CF_ACCESS_CLIENT_SECRET_STAGING:
        required: true

jobs:
  smoke-test:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    environment: Staging
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          token: ${{ secrets.FRAMEWORK_REPO_TOKEN }}

      - uses: voidzero-dev/setup-vp@1b32467adbe183473499fd9d5d372c3ed9641754 # v1.18.0
        with:
          cache: true
          node-version-file: .node-version
          run-install: false

      - run: vp install --frozen-lockfile
      - run: mkdir -p packages/dashboard/.void && echo '{"files":[]}' > packages/dashboard/.void/tsconfig.json

      # Build framework packages (void CLI + vue adapter needed for deploy)
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: framework/node_modules
          key: framework-${{ hashFiles('framework/pnpm-lock.yaml') }}
      - run: vp install --frozen-lockfile
        working-directory: framework
      - run: vp run build
        working-directory: framework
      # run install again to link
      - run: vp install
        working-directory: framework

      # Invoke the freshly built CLI directly instead of `vp exec void`.
      # The `void` bin (dist/cli/cli.mjs) is only built by the `vp run build`
      # step above, but the bin symlink is created at install time — and the
      # post-build `vp install` short-circuits ("Already up to date") without
      # re-linking node_modules/.bin/void, so `vp exec void` can't find it.
      # dist/cli/cli.mjs is guaranteed to exist here because the build ran.
      - name: Deploy kitchen-sink
        working-directory: framework/playground/kitchen-sink
        run: node node_modules/void/dist/cli/cli.mjs deploy --project kitchen-sink
        env:
          VOID_TOKEN: ${{ secrets.VOID_TOKEN_STAGING }}
          VOID_API_URL: https://api.staging.void.cloud
          STAGING: '1'
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID_STAGING }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET_STAGING }}

      # Install Chromium for Playwright
      - run: vp exec playwright install chromium

      - name: Reset app state
        run: |
          curl -sf -X POST https://kitchen-sink.staging.void.app/api/reset \
            -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
            -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET"
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID_STAGING }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET_STAGING }}

      - name: Run smoke tests
        run: node --test-timeout=120000 --test scripts/kitchen-sink-smoke-test.ts
        env:
          SMOKE_URL: https://kitchen-sink.staging.void.app
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID_STAGING }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET_STAGING }}
