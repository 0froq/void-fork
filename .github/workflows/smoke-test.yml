name: Smoke Test

on:
  schedule:
    - cron: "0 0 * * *" # daily at 8am SGT (midnight UTC)
  workflow_dispatch:
  workflow_call:
    secrets:
      FRAMEWORK_REPO_TOKEN:
        required: true
      VOID_TOKEN_STAGING:
        required: true

jobs:
  smoke-test:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.FRAMEWORK_REPO_TOKEN }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Build framework packages (void CLI + vue adapter needed for deploy)
      - uses: actions/cache@v4
        with:
          path: framework/node_modules
          key: framework-${{ hashFiles('framework/pnpm-lock.yaml') }}
      - run: pnpm --dir framework install --frozen-lockfile
      - run: pnpm --dir framework build
      # run install again to link
      - run: pnpm --dir framework install

      - name: Deploy kitchen-sink
        working-directory: framework/playground/kitchen-sink
        run: npx void deploy --project kitchen-sink
        env:
          VOID_TOKEN: ${{ secrets.VOID_TOKEN_STAGING }}
          STAGING: "1"

      # Install Chromium for Playwright
      - run: npx playwright install chromium

      - name: Reset app state
        run: curl -sf -X POST https://kitchen-sink.staging.void.app/api/reset

      - name: Run smoke tests
        run: node --test-timeout=120000 --test scripts/kitchen-sink-smoke-test.ts
        env:
          SMOKE_URL: https://kitchen-sink.staging.void.app
