name: Deploy Production

on:
  push:
    branches: [prod]

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    secrets:
      FRAMEWORK_REPO_TOKEN: ${{ secrets.FRAMEWORK_REPO_TOKEN }}

  deploy:
    needs: ci
    runs-on: blacksmith-4vcpu-ubuntu-2404
    environment: Prod
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          submodules: recursive
          token: ${{ secrets.FRAMEWORK_REPO_TOKEN }}

      - uses: voidzero-dev/setup-vp@2dec1e33f4ab2c6d5bce1b0c4607961bb1a3f7a1 # v1.12.0
        with:
          cache: true
          node-version-file: .node-version
          run-install: false

      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: framework/node_modules
          key: framework-${{ hashFiles('framework/pnpm-lock.yaml') }}
      - run: vp install --frozen-lockfile
        working-directory: framework
      - run: vp run build
        working-directory: framework
      - run: vp install --frozen-lockfile

      - run: vp run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
