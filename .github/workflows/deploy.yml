name: Deploy Production

on:
  push:
    branches: [prod]

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    secrets:
      FRAMEWORK_REPO_TOKEN: ${{ secrets.FRAMEWORK_REPO_TOKEN }}

  deploy:
    needs: ci
    runs-on: blacksmith-4vcpu-ubuntu-2404
    environment: Prod
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          token: ${{ secrets.FRAMEWORK_REPO_TOKEN }}

      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1.10.0
        with:
          cache: true
          node-version-file: .node-version
          run-install: false

      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: framework/node_modules
          key: framework-${{ hashFiles('framework/pnpm-lock.yaml') }}
      - run: vp install --frozen-lockfile
        working-directory: framework
      - run: vp run build
        working-directory: framework
      - run: vp install --frozen-lockfile

      - run: vp run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
