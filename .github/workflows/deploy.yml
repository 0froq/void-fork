name: Deploy Production

on:
  push:
    branches: [prod]

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    secrets:
      FRAMEWORK_REPO_TOKEN: ${{ secrets.FRAMEWORK_REPO_TOKEN }}

  deploy:
    needs: ci
    runs-on: blacksmith-4vcpu-ubuntu-2404
    environment: Prod
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          token: ${{ secrets.FRAMEWORK_REPO_TOKEN }}

      - uses: voidzero-dev/setup-vp@1b32467adbe183473499fd9d5d372c3ed9641754 # v1.18.0
        with:
          cache: true
          node-version-file: .node-version
          run-install: false

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: framework/node_modules
          key: framework-${{ hashFiles('framework/pnpm-lock.yaml') }}
      - run: vp install --frozen-lockfile
        working-directory: framework
      - run: vp run build
        working-directory: framework
      - run: vp install --frozen-lockfile

      - run: vp run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
