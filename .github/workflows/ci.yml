name: CI

on:
  pull_request:
    branches: [main]
  workflow_call:
    secrets:
      FRAMEWORK_REPO_TOKEN:
        required: true

jobs:
  lint-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.FRAMEWORK_REPO_TOKEN }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/cache@v4
        with:
          path: framework/node_modules
          key: framework-${{ hashFiles('framework/pnpm-lock.yaml') }}
      - run: pnpm --dir framework install --frozen-lockfile
      - run: pnpm --dir framework build
      - run: pnpm install --frozen-lockfile
      - run: mkdir -p packages/dashboard/.void && echo '{"files":[]}' > packages/dashboard/.void/tsconfig.json
      - run: pnpm lint
      - run: pnpm fmt --check
      - run: pnpm -r build
      - run: pnpm check

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - suite: unit
            pattern: test/unit
          - suite: integration
            pattern: api/test/integration
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.FRAMEWORK_REPO_TOKEN }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/cache@v4
        with:
          path: framework/node_modules
          key: framework-${{ hashFiles('framework/pnpm-lock.yaml') }}
      - run: pnpm --dir framework install --frozen-lockfile
      - run: pnpm --dir framework build
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: pnpm vitest --run ${{ matrix.pattern }}
