name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  lint-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build:all
      - run: pnpm check

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - suite: unit
            pattern: test/unit
          - suite: integration
            pattern: void/test/integration
          - suite: pages-adapters-react-vue
            pattern: react/test/integration vue/test/integration
          - suite: pages-adapters-svelte-solid
            pattern: svelte/test/integration solid/test/integration
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - run: pnpm exec playwright install --with-deps chromium
        if: matrix.suite == 'pages-adapters-react-vue' || matrix.suite == 'pages-adapters-svelte-solid'

      - run: pnpm vitest --run ${{ matrix.pattern }}
