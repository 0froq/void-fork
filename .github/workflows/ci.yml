name: CI

on:
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  lint-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm -r --filter '!website' build
      - run: pnpm check

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: unit
            pattern: test/unit
          - suite: integration
            pattern: packages/{platform,vite-cloud}/test/integration
          - suite: integration-pages-adapters
            pattern: packages/{react,vue}/test/integration
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --filter './packages/*' --filter '!website' build

      - uses: actions/cache@v4
        if: matrix.suite == 'integration-pages-adapters'
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm exec playwright install chromium
        if: matrix.suite == 'integration-pages-adapters' && steps.playwright-cache.outputs.cache-hit != 'true'
      - run: pnpm exec playwright install-deps chromium
        if: matrix.suite == 'integration-pages-adapters'

      - run: pnpm vitest --run '${{ matrix.pattern }}'
