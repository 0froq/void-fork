name: CI

on:
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  lint-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm -r build
      - run: pnpm check

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - suite: unit
            pattern: test/unit
          - suite: integration
            pattern: api/test/integration
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: pnpm vitest --run ${{ matrix.pattern }}
