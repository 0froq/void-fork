name: CI

on:
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  lint-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      # type check includes core and playground, and all needs to be built
      # because playground typecheck relies on vite-cloud generated types
      - run: pnpm --filter '!website' --filter '!.' build
      - run: pnpm check

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - suite: unit
            pattern: test/unit
          - suite: integration
            pattern: platform/test/integration vite-cloud/test/integration
          - suite: integration-pages-adapters
            pattern: react/test/integration vue/test/integration svelte/test/integration
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # only need to build core and 2 adapters
      - run: pnpm --filter './packages/*' --filter '!website' build

      - uses: actions/cache@v4
        if: matrix.suite == 'integration-pages-adapters'
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm exec playwright install chromium
        if: matrix.suite == 'integration-pages-adapters' && steps.playwright-cache.outputs.cache-hit != 'true'
      - run: pnpm exec playwright install-deps chromium
        if: matrix.suite == 'integration-pages-adapters'

      - run: pnpm vitest --run ${{ matrix.pattern }}
