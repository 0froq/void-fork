name: CI

on:
  pull_request:
    branches: [main]
  workflow_call:
    secrets:
      FRAMEWORK_REPO_TOKEN:
        required: true

jobs:
  lint-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.FRAMEWORK_REPO_TOKEN }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/cache@v4
        with:
          path: framework/node_modules
          key: framework-${{ hashFiles('framework/pnpm-lock.yaml') }}
      - run: pnpm --dir framework install --frozen-lockfile
      - run: pnpm --dir framework build
      - run: pnpm install --frozen-lockfile
      - run: mkdir -p packages/dashboard/.void && echo '{"files":[]}' > packages/dashboard/.void/tsconfig.json
      - run: pnpm lint
      - run: pnpm fmt --check
      - run: pnpm -r build
      - run: pnpm check

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: unit
            pattern: test/unit
          - suite: integration
            pattern: api/test/integration
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.FRAMEWORK_REPO_TOKEN }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/cache@v4
        with:
          path: framework/node_modules
          key: framework-${{ hashFiles('framework/pnpm-lock.yaml') }}
      - run: pnpm --dir framework install --frozen-lockfile
      - run: pnpm --dir framework build
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: pnpm vitest --run ${{ matrix.pattern }}

  schema-compat:
    runs-on: ubuntu-latest
    env:
      POSTGRES_USER: void_ci
      POSTGRES_PASSWORD: void_ci_pass
      POSTGRES_DB: void_schema_compat
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U $POSTGRES_USER"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5
    steps:
      # --- Phase 1: Apply PR branch migrations to real PG ---
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.FRAMEWORK_REPO_TOKEN }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/cache@v4
        with:
          path: framework/node_modules
          key: framework-${{ hashFiles('framework/pnpm-lock.yaml') }}
      - run: pnpm --dir framework install --frozen-lockfile
      - run: pnpm --dir framework build
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @voidcloud/api run migrate
        env:
          DATABASE_URL: postgresql://${{ env.POSTGRES_USER }}:${{ env.POSTGRES_PASSWORD }}@localhost:5432/${{ env.POSTGRES_DB }}

      # --- Phase 2: Run prod branch tests against new schema ---
      - uses: actions/checkout@v4
        with:
          ref: prod
          clean: false
          submodules: recursive
          token: ${{ secrets.FRAMEWORK_REPO_TOKEN }}
      - run: git clean -fd
      - run: pnpm --dir framework install --frozen-lockfile
      - run: pnpm --dir framework build
      - run: pnpm install --frozen-lockfile
      - run: mkdir -p packages/dashboard/.void && echo '{"files":[]}' > packages/dashboard/.void/tsconfig.json
      - run: pnpm -r build
      - run: pnpm vitest --run
        env:
          VOID_TEST_DATABASE_URL: postgresql://${{ env.POSTGRES_USER }}:${{ env.POSTGRES_PASSWORD }}@localhost:5432/${{ env.POSTGRES_DB }}
