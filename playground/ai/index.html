<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Playground — Vite Cloud</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        font-size: 0.875rem;
        line-height: 1.5;
        background: #16171d;
        color: #fff;
        height: 100vh;
        overflow: hidden;
      }

      #root {
        height: 100vh;
        display: flex;
        flex-direction: column;
      }

      /* Nav */
      .nav {
        display: flex;
        align-items: center;
        gap: 1.5rem;
        padding: 0.625rem 1.25rem;
        border-bottom: 1px solid #3b3440;
        flex-shrink: 0;
      }
      .nav-brand {
        font-weight: 600;
        font-size: 0.875rem;
        color: #fff;
        letter-spacing: -0.01em;
      }
      .nav-brand span {
        color: #b39aff;
      }

      /* Layout */
      .layout {
        display: flex;
        flex: 1;
        min-height: 0;
      }

      /* Sidebar */
      .sidebar {
        width: 320px;
        border-right: 1px solid #3b3440;
        display: flex;
        flex-direction: column;
        flex-shrink: 0;
        min-height: 0;
      }
      .sidebar-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0.75rem 1rem;
        border-bottom: 1px solid #3b3440;
        flex-shrink: 0;
      }
      .sidebar-header h2 {
        font-size: 0.75rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: rgba(255, 255, 255, 0.7);
      }
      .sidebar-body {
        flex: 1;
        overflow-y: auto;
        min-height: 0;
      }

      /* Model list */
      .model-group-header {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.5rem 1rem;
        cursor: pointer;
        color: rgba(255, 255, 255, 0.7);
        font-size: 0.75rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        user-select: none;
        border-bottom: 1px solid #3b3440;
      }
      .model-group-header:hover {
        background: rgba(179, 154, 255, 0.05);
      }
      .model-group-header .arrow {
        font-size: 0.625rem;
        transition: transform 0.15s;
      }
      .model-group-header .arrow.open {
        transform: rotate(90deg);
      }
      .model-group-header .count {
        margin-left: auto;
        font-weight: 400;
        color: rgba(255, 255, 255, 0.4);
      }
      .model-item {
        display: block;
        width: 100%;
        padding: 0.375rem 1rem 0.375rem 1.75rem;
        background: none;
        border: none;
        border-bottom: 1px solid rgba(59, 52, 64, 0.5);
        color: rgba(255, 255, 255, 0.8);
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
        font-size: 0.75rem;
        text-align: left;
        cursor: pointer;
        text-overflow: ellipsis;
        overflow: hidden;
        white-space: nowrap;
      }
      .model-item:hover {
        background: rgba(179, 154, 255, 0.1);
        color: #fff;
      }
      .model-item.active {
        background: rgba(179, 154, 255, 0.15);
        color: #b39aff;
      }
      .model-item.disabled {
        color: rgba(255, 255, 255, 0.3);
        cursor: default;
      }
      .model-item.disabled:hover {
        background: none;
        color: rgba(255, 255, 255, 0.3);
      }

      /* Badge */
      .badge {
        display: inline-block;
        padding: 0.0625rem 0.375rem;
        font-size: 0.625rem;
        font-weight: 500;
        border-radius: 2px;
        background: rgba(179, 154, 255, 0.15);
        color: #b39aff;
      }

      /* Chat */
      .chat {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-width: 0;
        min-height: 0;
      }
      .chat-header {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        padding: 0.75rem 1.25rem;
        border-bottom: 1px solid #3b3440;
        flex-shrink: 0;
      }
      .chat-header .model-name {
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
        font-size: 0.8rem;
        color: #b39aff;
      }

      /* Messages */
      .messages {
        flex: 1;
        overflow-y: auto;
        padding: 1rem 1.25rem;
        display: flex;
        flex-direction: column;
        gap: 0.125rem;
        min-height: 0;
      }
      .message {
        padding: 0.625rem 0;
      }
      .message + .message {
        border-top: 1px solid rgba(59, 52, 64, 0.4);
      }
      .message-role {
        font-size: 0.6875rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        margin-bottom: 0.25rem;
      }
      .message-role.user {
        color: rgba(255, 255, 255, 0.5);
      }
      .message-role.assistant {
        color: #b39aff;
      }
      .message-role.system {
        color: rgba(255, 255, 255, 0.3);
      }
      .message-content {
        font-size: 0.875rem;
        line-height: 1.6;
        color: rgba(255, 255, 255, 0.9);
        white-space: pre-wrap;
        word-break: break-word;
      }
      .message-content.system-content {
        color: rgba(255, 255, 255, 0.4);
        font-style: italic;
      }
      .cursor-blink {
        display: inline-block;
        width: 0.5em;
        height: 1em;
        background: #b39aff;
        vertical-align: text-bottom;
        animation: blink 0.8s step-end infinite;
      }
      @keyframes blink {
        50% {
          opacity: 0;
        }
      }
      .empty-state {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        color: rgba(255, 255, 255, 0.25);
        font-size: 0.875rem;
      }

      /* Input */
      .chat-input {
        display: flex;
        gap: 0.5rem;
        padding: 0.75rem 1.25rem;
        border-top: 1px solid #3b3440;
        flex-shrink: 0;
        align-items: flex-end;
      }
      .chat-input textarea {
        flex: 1;
        resize: none;
        padding: 0.5rem 0.75rem;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid #3b3440;
        border-radius: 4px;
        color: #fff;
        font-family: inherit;
        font-size: 0.875rem;
        line-height: 1.5;
        min-height: 2.5rem;
        max-height: 8rem;
        outline: none;
      }
      .chat-input textarea::placeholder {
        color: rgba(255, 255, 255, 0.3);
      }
      .chat-input textarea:focus {
        border-color: #b39aff;
      }
      .chat-input button {
        padding: 0.5rem 1rem;
        background: #b39aff;
        border: none;
        border-radius: 4px;
        color: #16171d;
        font-weight: 600;
        font-size: 0.8125rem;
        cursor: pointer;
        white-space: nowrap;
      }
      .chat-input button:hover {
        background: #c4b0ff;
      }
      .chat-input button:disabled {
        opacity: 0.4;
        cursor: default;
      }

      /* System message toggle */
      .system-toggle {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.5rem 1.25rem;
        border-bottom: 1px solid rgba(59, 52, 64, 0.5);
        flex-shrink: 0;
      }
      .system-toggle label {
        font-size: 0.6875rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: rgba(255, 255, 255, 0.4);
        white-space: nowrap;
      }
      .system-toggle input {
        flex: 1;
        padding: 0.25rem 0.5rem;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(59, 52, 64, 0.7);
        border-radius: 3px;
        color: rgba(255, 255, 255, 0.7);
        font-family: inherit;
        font-size: 0.75rem;
        outline: none;
      }
      .system-toggle input:focus {
        border-color: #b39aff;
      }
      .system-toggle input::placeholder {
        color: rgba(255, 255, 255, 0.2);
      }

      /* Scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #3b3440;
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #4e4558;
      }

      /* Loading */
      .loading {
        color: rgba(255, 255, 255, 0.3);
        font-size: 0.75rem;
        padding: 1rem;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
